# Station forecasts and mean reversion (sydney/pipeline/station_experiment.py) on a read-only copy of the `data` branch.
# No secrets, nothing saved or deployed; the result is in the run summary and kept for 14 days as a run artifact.
name: station-experiment

on:
  push:
    branches: ["model/**"]
    paths: ["sydney/pipeline/station_experiment.py", ".github/workflows/station-experiment.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: station-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  station-reversion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          path: src
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/sydney/requirements.txt
      - run: pip install -q -r src/sydney/requirements.txt
      - shell: bash   # pipefail: a failed script fails the step
        run: |
          git clone -q --depth 1 --branch data "https://github.com/${GITHUB_REPOSITORY}.git" state
          rm -rf state/.git
          python src/sydney/pipeline/station_experiment.py state | tee station.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: station-reversion
          path: station.md
          retention-days: 14
