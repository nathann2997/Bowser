# Model experiments (sydney/pipeline/experiment.py) on a read-only copy of the `data` branch: one job per variant, then
# a comparison in the run summary. No secrets, nothing saved or deployed; the scored results are kept for 14 days as a
# run artifact. Runs when a `model/` branch changes the model or the experiment (workflow_dispatch only works once this
# file is on main).
name: model-experiment

on:
  push:
    branches: ["model/**"]
    paths: ["sydney/pipeline/model.py", "sydney/pipeline/experiment.py", "sydney/pipeline/track_api.py",
            "sydney/pipeline/fuels.py", "sydney/requirements-experiment.txt", ".github/workflows/model-experiment.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:   # a newer push replaces a run still going
  group: model-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # model.py's run section moved under `if __name__ == "__main__"` so experiment.py can import it: the live forecast
  # must come out the same as from the version on main
  same-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          path: src
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/sydney/requirements.txt
      - run: pip install -q -r src/sydney/requirements.txt
      - name: Forecast from main's model.py and from this commit's
        run: |
          git clone -q --depth 1 --branch data "https://github.com/${GITHUB_REPOSITORY}.git" state
          rm -rf state/.git state/pipeline && cp -r src/sydney/pipeline state/pipeline
          git -C src show "$(git -C src merge-base HEAD origin/main):sydney/pipeline/model.py" > state/pipeline/model_main.py
          python state/pipeline/model_main.py state > /dev/null && cp state/store/forecast.json main.json
          python state/pipeline/model.py state > /dev/null && cp state/store/forecast.json this.json
          python -c "import json,sys; a,b=json.load(open('main.json')),json.load(open('this.json')); print('same forecast' if a==b else 'DIFFERENT'); sys.exit(a!=b)"

  variants:   # the matrix comes from experiment.py's VARIANTS, so the two can't drift apart
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          path: src
          persist-credentials: false
      - id: list
        run: echo "list=$(python3 src/sydney/pipeline/experiment.py --list)" >> "$GITHUB_OUTPUT"

  variant:
    needs: variants
    runs-on: ubuntu-latest
    timeout-minutes: 120   # CatBoost and ExtraTrees over 70 folds x 4 horizons
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.variants.outputs.list) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          path: src
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/sydney/requirements-experiment.txt
      - run: pip install -q -r src/sydney/requirements-experiment.txt   # + xgboost, catboost; shared pins = production's
      - name: Walk-forward and score
        env:
          VARIANT: ${{ matrix.variant }}
          QUICK: ${{ contains(github.event.head_commit.message, '[quick]') && '1' || '' }}   # folds from 2025-10 only
        run: |
          git clone -q --depth 1 --branch data "https://github.com/${GITHUB_REPOSITORY}.git" state
          rm -rf state/.git
          mkdir -p out
          python src/sydney/pipeline/experiment.py state "$VARIANT" out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: result-${{ matrix.variant }}
          path: out/*.json
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:   # the walk-forward predictions, for the ensemble and the paired comparison
          name: preds-${{ matrix.variant }}
          path: out/${{ matrix.variant }}_base/store/backtest_*.parquet
          retention-days: 14

  combine:   # an average of saved variants (no refit) and every variant against `base` on the same rows
    needs: variant
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45   # three replays, ~70 bootstrap scopes per variant
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          path: src
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/sydney/requirements-experiment.txt
      - run: pip install -q -r src/sydney/requirements-experiment.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          pattern: preds-*
          path: preds
      - name: Ensembles, then the paired comparison
        run: |
          git clone -q --depth 1 --branch data "https://github.com/${GITHUB_REPOSITORY}.git" state
          rm -rf state/.git
          mkdir -p out
          for e in $(python3 src/sydney/pipeline/experiment.py --ensembles); do
            PREDS=preds python src/sydney/pipeline/experiment.py state "$e" out || continue
            mkdir -p "preds/preds-$e" && cp out/${e}_base/store/backtest_*.parquet "preds/preds-$e/"
          done
          python src/sydney/pipeline/experiment.py --compare preds out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: result-combine
          path: out/*.json
          retention-days: 14

  report:
    needs: [variant, combine]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          path: src
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          pattern: result-*
          merge-multiple: true
          path: out
      - shell: bash   # bash -o pipefail: a failed report fails the step instead of leaving an empty summary
        run: python3 src/sydney/pipeline/experiment.py --report out | tee report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: report
          path: report.md
          retention-days: 14
